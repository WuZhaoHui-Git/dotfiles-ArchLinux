# see default setting https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml
#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_dir_first = true

[opener]
folder = [
  { run = "dolphin %s1", orphan = true, desc = "dolphin", for = "linux" },
  { run = "kitty \"lazygit -p %s1\"", block = true, desc = "lazygit", for = "linux" },
]

edit = [
  { run = "${EDITOR:-nvim} %s1", block = true, desc = "$EDITOR", for = "linux" },
  { run = "nvim %s1", block = true, desc = "neovim", for = "linux" },
  { run = "code %s1", orphan = true, desc = "vscode", for = "linux" },

  { run = "%EDITOR% %s1", block = true, desc = "%EDITOR%", for = "windows" },
  { run = "nvim %s1", block = true, desc = "neovim", for = "windows" },
  { run = "code %s1", orphan = true, desc = "code", for = "windows" },
  { run = "code -w %s1", block = true, desc = "code (block)", for = "windows" },
]

office = [
  { run = "wps %s1", orphan = true, desc = "WPS", for = "linux" },
  { run = "libreoffice %s1", orphan = true, desc = "Libreoffice", for = "linux" },

  { run = "wps %s1", orphan = true, desc = "wps", for = "windows" },
]

pdf = [
  { run = "okular %s1", orphan = true, desc = "Okular", for = "linux" },
  { run = "wpspdf %s1", orphan = true, desc = "WPS PDF", for = "linux" },
]

image = [
  { run = "qimgv %s1", orphan = true, desc = "qimgv", for = "linux" },
  { run = "pinta %s1", orphan = true, desc = "krita", for = "linux" },
  { run = "satty %s1", orphan = true, desc = "satty", for = "linux" },
]

media = [
  { run = "xdg-open %s1", orphan = true, desc = "Play", for = "linux" },
  { run = "mpv %s1", orphan = true, desc = "mpv", for = "linux" },
  { run = "vlc %s1", orphan = true, desc = "vlc", for = "linux" },
]

[open]
rules = [
  # Folder
  { url = "*/", use = [ "folder", "edit", "open", "reveal", ] },
  # Text
  { mime = "text/*", use = "edit" },
  # office
  { mime = "application/{msword,ms-excel,ms-powerpoint,*document,*sheet,*presentation}", use = [ "open", "office", ] },
  # PDF
  { mime = "application/pdf", use = [ "open", "pdf", ] },
  # Image
  { mime = "image/*", use = [ "open", "image", ] },
  # Media
  { mime = "{video,audio}/*", use = "media" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal", ] },
  # Empty file
  { mime = "inode/empty", use = [ "edit", "reveal", ] },
  # Virtual file system
  { mime = "vfs/{absent,stale}", use = "download" },
  # Fallback
  { mime = "*", use = [ "open", "reveal", ] },
]

[plugin]
prepend_previewers = [{ mime = "*executable*", run = "exiftool" }]
