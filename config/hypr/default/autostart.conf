# banner generate by http://www.network-science.de/ascii/
# use font style standard

# 密码存储器
exec-once = /usr/lib/pam_kwallet_init
# 用户认证窗口，提升root权限支持
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent || /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# 启用xdg-disktop-protal-hypeland所需环境
exec-once = dbus-update-activation-environment --all
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# 启用插件
exec-once = hyprpm reload
# xwayland 缩放
exec-once = xrdb ~/.Xresources

# 输入法
exec-once = fcitx5 -r -D
# 状态栏
exec-once = waybar
# 壁纸
exec-once = hyprpaper
# 电脑空闲、锁屏、挂起
exec-once = hypridle
# 剪贴板
exec-once = wl-paste --watch cliphist store
# 通知
exec-once = mako
# OSD 通知
exec-once = swayosd-server
# 网络
exec-once = nm-applet
# 代理
exec-once = clash-verge
# 蓝牙
exec-once = blueman-applet
# aria2 下载器
exec-once = motrix
# 音乐播放守护进程
exec-once = systemctl --user start mpd
exec-once = systemctl --user start mpdris2-rs
# 共享 xwayland 屏幕
# exec-once = xwaylandvideobridge
