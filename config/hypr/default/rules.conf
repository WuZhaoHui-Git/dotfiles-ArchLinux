# ######## Window rules ########

# Disable blur for every window
windowrule = match:class .*, no_blur on
# No shadow for tiled windows (matches windows that are not float oning).
windowrule = no_shadow on, match:float 0

# Floating
## File Choose
windowrule = float on, center on, match:title = ^(Open File|Select a File|Choose o wallpaper|Open Folder|Save As|Library|File Upload)(.*)$
windowrule = float on, center on, match:title ^(.*)wants to (save|open)&
windowrule = float on, center on, size (monitor_w*0.65) (monitor_h*0.65), match:class ^(org.freedesktop.impl.portal.desktop.)[\w]+
## Applet
windowrule = float on, center on, size (monitor_w*0.5) (monitor_h*0.5), match:class = ^(.*)(pavucontrol|nm-connection-editor|blueman-manager|plasmawindowed)(.*)$
## Other
windowrule = float on, match:class kcm_(.*)
windowrule = float on, match:class (.*)bluedevilwizard
windowrule = float on, match:class .*Welcome
windowrule = float on, size (monitor_w*0.45) (monitor_h*0.45), match:class ^(Zotrro)$

# Move
## kde-material-you-colors spawns a window when changing dark/light theme. This is to make sure it doesn't interfere at all.
windowrule = float on, no_initial_focus on, move 999999 999999, match:class ^(plasma-changeicons)$
# stupid dolphin copy
windowrule = move 40 80, match:title ^(Copying — Dolphin)$

# Tiling
windowrule = tile on, match:class ^dev\.warp\.Warp$

# Picture-in-Picture
windowrule = float on, keep_aspect_ratio on, move (monitor_w*0.73) (monitor_h*0.72), size (monitor_w*0.25) (monitor_h*0.25), pin on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# --- Tearing ---
windowrule = immediate on, match:title .*\.exe
windowrule = immediate on, match:title .*minecraft.*
windowrule = immediate on, match:class ^(steam_app).*

# apps
## QQ
windowrule = float on, center on, size (monitor_w*0.55) (monitor_h*0.55), match:class ^(QQ)$
windowrule = tile on, match:class ^(QQ)$, match:title ^(QQ)$
windowrule = workspace special, match:class QQ

## 微信
windowrule = tag +wechat, match:class ^(wechat)$
windowrule = tile on, match:tag wechat, match:title 微信
windowrule = stay_focused on, match:tag wecaht, match:title 微信, match:float 0
windowrule = no_blur on, no_shadow on, border_size 0, match:tag wechat, match:title negative:^(朋友圈|微信|设置|聊天文件|预览|图片和视频)[\w]*
windowrule = no_blur on, no_shadow on, border_size 0, match:tag wechat, match:title 微信发送给
windowrule = float on, center on, size (monitor_w*0.65) (monitor_h*0.65), match:class ^(wechat)$, match:title (朋友圈|设置|聊天文件|预览|图片和视频)
windowrule = workspace 7, match:tag wecaht

## 微信开发者
windowrule = tile on, match:class $(wechat-devtools)$

## telegram
windowrule = tag +telegram, match:class ^(org.telegram.desktop)$
windowrule = tile on, match:tag telegram, match:initial_title .*(Telegram).*
windowrule = float on, center on, size (monitor_w*0.65) (monitor_h*0.65), match:tag telegram, match:title 媒体查看器
windowrule = workspace special, match:tag telegram

## discord
windowrule = tag +discord, match:class ^(discord)$
windowrule = workspace special, match:tag discord

## microsoft-edge
windowrule = tag +microsoft-egde, match:class ^(microsoft-egde)$
windowrule = float on, match:tag microsoft-egde, match:title ^(File Preview).*
windowrule = size (monitor_w*0.75) (monitor_h*0.75), match:tag microsoft-egde, match:title ^(File Preview).*

## g4music
windowrule = tag +g4music, match:class .*(g4music)&
windowrule = workspace 10, match:tag g4music

# Jetbrains apps
windowrule = tag +jetbrains, match:class ^(jetbrains)[\W\w]*
windowrule = center on, size (monitor_w*0.75) (monitor_h*0.75), match:tag jetbrains,
# Jetbrains xwayland fouse error
# windowrule = no_initial_focus on, match:xwayland 1

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*
# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# ######## Workspace rules ########
workspace = special:special, gapsout:30

# ######## Layer rules ############
layerrule = xray 1, no_anim on, match:namespace = (walker|rofi|selection|overview|anyrun|indicator|osk|hyprpicker|noanim)(.*)
layerrule = blur on, match:namespace (gtk-layer-shell|launcher|notifications)
layerrule = ignore_alpha 0, match:namespace gtk-layer-shell
layerrule = ignore_alpha 0.5, match:namespace launcher
layerrule = ignore_alpha 0.69, match:namespace notifications
layerrule = blur on, match:namespace logout_dialog # wlogout
